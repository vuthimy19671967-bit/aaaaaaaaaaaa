<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Free Image Uploader</title>
    <!-- Load Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
        /* Custom animation for the upload success message */
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-slide-up {
            animation: slideUp 0.4s ease-out forwards;
        }
    </style>
</head>
<body class="bg-gradient-to-br from-slate-50 to-indigo-50 min-h-screen flex flex-col text-slate-800">

    <nav class="w-full bg-white shadow-sm px-6 py-4 flex justify-between items-center">
        <div class="flex items-center gap-2 text-indigo-600 font-bold text-xl tracking-tight">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z" />
            </svg>
            UpLoadr
        </div>
        <div>
            <a href="#" class="text-sm font-medium text-slate-500 hover:text-indigo-600 transition-colors">Pricing</a>
            <a href="#" class="ml-4 text-sm font-medium text-slate-500 hover:text-indigo-600 transition-colors">Sign In</a>
        </div>
    </nav>

    <main class="flex-grow flex items-center justify-center p-6">
        <div class="bg-white rounded-3xl shadow-xl w-full max-w-2xl overflow-hidden border border-slate-100 p-8">
            
            <div class="text-center mb-8">
                <h1 class="text-3xl font-bold text-slate-800 mb-2">Upload your image</h1>
                <p class="text-slate-500">File should be Jpeg, Png,...</p>
            </div>

            <div id="drop-zone" class="relative border-2 border-dashed border-indigo-200 rounded-2xl bg-indigo-50/50 hover:bg-indigo-50 transition-colors duration-300 flex flex-col items-center justify-center py-12 px-6 cursor-pointer group mb-6">
                
                <!-- Hidden file input -->
                <input type="file" id="file-input" class="absolute inset-0 w-full h-full opacity-0 cursor-pointer z-10" accept="image/*">
                
                <div id="upload-prompt" class="flex flex-col items-center pointer-events-none">
                    <div class="bg-white p-4 rounded-full shadow-sm mb-4 group-hover:scale-110 transition-transform duration-300">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-10 w-10 text-indigo-500" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12" />
                        </svg>
                    </div>
                    <p class="text-lg font-medium text-slate-700 mb-1">Drag & Drop your image here</p>
                    <p class="text-sm text-slate-400">or click to browse</p>
                </div>

                <div id="preview-container" class="hidden w-full max-w-md mx-auto relative rounded-xl overflow-hidden shadow-md">
                    <img id="image-preview" src="" alt="Image Preview" class="w-full h-auto object-contain max-h-64 rounded-xl">
                    <button id="remove-btn" class="absolute top-2 right-2 bg-white/90 text-slate-700 p-1.5 rounded-full shadow hover:bg-red-50 hover:text-red-600 transition-colors z-20">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
                            <path fill-rule="evenodd" d="M4.293 4.293a1 1 0 011.414 0L10 8.586l4.293-4.293a1 1 0 111.414 1.414L11.414 10l4.293 4.293a1 1 0 01-1.414 1.414L10 11.414l-4.293 4.293a1 1 0 01-1.414-1.414L8.586 10 4.293 5.707a1 1 0 010-1.414z" clip-rule="evenodd" />
                        </svg>
                    </button>
                </div>
            </div>

            <div class="flex items-center justify-between">
                <span class="text-sm text-slate-400" id="file-info">No file selected</span>
                <button id="upload-btn" class="bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-2.5 px-6 rounded-xl shadow-lg shadow-indigo-200 transition-all active:scale-95 disabled:opacity-50 disabled:cursor-not-allowed" disabled>
                    Upload File
                </button>
            </div>

            <div id="success-message" class="hidden mt-6 bg-green-50 border border-green-200 text-green-700 px-4 py-3 rounded-xl flex items-center gap-3">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 text-green-500" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" />
                </svg>
                <div class="flex-1">
                    <p class="font-medium text-sm">Upload Successful!</p>
                    <p class="text-xs text-green-600/80">Your image is ready to be shared.</p>
                </div>
                <button class="text-green-600 hover:text-green-800 text-sm font-medium underline">Copy Link</button>
            </div>

        </div>
    </main>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const dropZone = document.getElementById('drop-zone');
            const fileInput = document.getElementById('file-input');
            const uploadPrompt = document.getElementById('upload-prompt');
            const previewContainer = document.getElementById('preview-container');
            const imagePreview = document.getElementById('image-preview');
            const removeBtn = document.getElementById('remove-btn');
            const fileInfo = document.getElementById('file-info');
            const uploadBtn = document.getElementById('upload-btn');
            const successMessage = document.getElementById('success-message');
            let currentFile = null;

            // Handle drag over effects
            ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(eventName => {
                dropZone.addEventListener(eventName, preventDefaults, false);
            });

            function preventDefaults(e) {
                e.preventDefault();
                e.stopPropagation();
            }

            ['dragenter', 'dragover'].forEach(eventName => {
                dropZone.addEventListener(eventName, highlight, false);
            });

            ['dragleave', 'drop'].forEach(eventName => {
                dropZone.addEventListener(eventName, unhighlight, false);
            });

            function highlight(e) {
                dropZone.classList.add('border-indigo-500', 'bg-indigo-100/50');
                dropZone.classList.remove('border-indigo-200', 'bg-indigo-50/50');
            }

            function unhighlight(e) {
                dropZone.classList.remove('border-indigo-500', 'bg-indigo-100/50');
                dropZone.classList.add('border-indigo-200', 'bg-indigo-50/50');
            }

            dropZone.addEventListener('drop', handleDrop, false);

            function handleDrop(e) {
                const dt = e.dataTransfer;
                const files = dt.files;
                handleFiles(files);
            }

            fileInput.addEventListener('change', function() {
                handleFiles(this.files);
            });

            function handleFiles(files) {
                if (files.length > 0) {
                    const file = files[0];
                    if (file.type.startsWith('image/')) {
                        currentFile = file;
                        showPreview(file);
                    } else {
                        // Normally we'd use an alert, but per constraints we update UI text
                        fileInfo.textContent = "Error: Please select an image file.";
                        fileInfo.classList.add('text-red-500');
                    }
                }
            }

            function showPreview(file) {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onloadend = function() {
                    imagePreview.src = reader.result;
                    
                    // Toggle UI states
                    uploadPrompt.classList.add('hidden');
                    previewContainer.classList.remove('hidden');
                    
                    // We need to keep the file input above the preview, but ensure the remove button is clickable
                    fileInput.classList.add('hidden'); 
                    
                    fileInfo.textContent = `${file.name} (${(file.size / 1024 / 1024).toFixed(2)} MB)`;
                    fileInfo.classList.remove('text-red-500');
                    fileInfo.classList.add('text-slate-600');
                    
                    uploadBtn.disabled = false;
                    successMessage.classList.add('hidden');
                }
            }

            removeBtn.addEventListener('click', (e) => {
                e.preventDefault();
                e.stopPropagation();
                resetUploader();
            });

            function resetUploader() {
                currentFile = null;
                fileInput.value = '';
                imagePreview.src = '';
                
                uploadPrompt.classList.remove('hidden');
                previewContainer.classList.add('hidden');
                fileInput.classList.remove('hidden');
                
                fileInfo.textContent = 'No file selected';
                uploadBtn.disabled = true;
                successMessage.classList.add('hidden');
            }

            uploadBtn.addEventListener('click', () => {
                if (!currentFile) return;
                
                // Simulate upload process
                uploadBtn.textContent = 'Uploading...';
                uploadBtn.disabled = true;
                
                setTimeout(() => {
                    uploadBtn.textContent = 'Upload File';
                    uploadBtn.disabled = false;
                    
                    successMessage.classList.remove('hidden');
                    successMessage.classList.add('animate-slide-up');
                }, 1500);
            });
        });
    </script>
</body>
</html>
