// =====================================
// 2. DỮ LIỆU QUỐC GIA

let countries = [];

// =====================================
// 3. TRẠNG THÁI
// =====================================

let currentCategory = "dino";

// =====================================
// 4. CHUYỂN DANH MỤC
// =====================================

function showCategory(category) {
    currentCategory = category;

    document.getElementById("dinoBtn")
        .classList.toggle("active", category === "dino");

    document.getElementById("countryBtn")
        .classList.toggle("active", category === "country");

    document.getElementById("search").value = "";

    document.getElementById("search").placeholder =
        category === "dino"
            ? "🔍 Tìm tên khủng long..."
            : "🔍 Tìm tên quốc gia...";

    renderCards();
}

// =====================================
// 5. HIỂN THỊ KHỦNG LONG
// =====================================

function renderDino(dino) {
    return `
        <div class="card">
            <div class="card-image">${dino.icon}</div>

            <div class="card-content">
                <h3>${dino.name}</h3>

                <p>
                    <b>Tên khoa học:</b><br>
                    <i>${dino.scientific}</i>
                </p>

                <p><b>Thời kỳ:</b> ${dino.period}</p>
                <p><b>Thức ăn:</b> ${dino.diet}</p>
                <p><b>Chiều dài:</b> ${dino.length}</p>
                <p><b>Cân nặng:</b> ${dino.weight}</p>

                <span class="tag">🦖 Dinosaur</span>
            </div>
        </div>
    `;
}

// =====================================
// 6. HIỂN THỊ QUỐC GIA
// =====================================

function renderCountry(country) {
    const name = country.translations?.vie?.common
        || country.name.common;

    const capital = country.capital?.[0] || "Không có dữ liệu";

    const population = country.population
        ? country.population.toLocaleString("vi-VN")
        : "Không có dữ liệu";

    const region = country.region || "Không rõ";

    return `
        <div class="card">
            <div class="card-image">
                ${country.flags?.emoji || "🌍"}
            </div>

            <div class="card-content">
                <h3>${name}</h3>

                <p>
                    <b>Tên tiếng Anh:</b><br>
                    ${country.name.common}
                </p>

                <p><b>Thủ đô:</b> ${capital}</p>
                <p><b>Khu vực:</b> ${region}</p>
                <p><b>Dân số:</b> ${population}</p>

                <span class="tag">🌍 Country</span>
            </div>
        </div>
    `;
}

// =====================================
// 7. TÌM KIẾM VÀ HIỂN THỊ
// =====================================

function renderCards() {
    const grid = document.getElementById("grid");
    const count = document.getElementById("count");

    const query = document.getElementById("search")
        .value.trim().toLowerCase();

    let html = "";
    let total = 0;

    if (currentCategory === "dino") {

        const filtered = dinosaurs.filter(dino =>
            dino.name.toLowerCase().includes(query) ||
            dino.scientific.toLowerCase().includes(query) ||
            dino.period.toLowerCase().includes(query) ||
            dino.diet.toLowerCase().includes(query)
        );

        total = filtered.length;
        html = filtered.map(renderDino).join("");

    } else {

        const filtered = countries.filter(country => {
            const name = country.translations?.vie?.common
                || country.name.common;

            const capital = country.capital?.[0] || "";

            return (
                name.toLowerCase().includes(query) ||
                country.name.common.toLowerCase().includes(query) ||
                capital.toLowerCase().includes(query) ||
                (country.region || "").toLowerCase().includes(query)
            );
        });

        total = filtered.length;
        html = filtered.map(renderCountry).join("");
    }

    count.textContent = `Tìm thấy ${total} kết quả`;

    if (total === 0) {
        html = `
            <div class="empty">
                <h2>🔍 Không tìm thấy kết quả</h2>
                <p>Thử tìm kiếm bằng từ khóa khác.</p>
            </div>
        `;
    }

    grid.innerHTML = html;
}

// =====================================
// 8. TẢI DỮ LIỆU QUỐC GIA
// =====================================

async function loadCountries() {
    try {
        const response = await fetch(
            "https://restcountries.com/v3.1/all?fields=name,capital,flags,population,region,translations"
        );

        if (!response.ok) {
            throw new Error("Không thể tải dữ liệu quốc gia");
        }

        countries = await response.json();

        countries.sort((a, b) => {
            const nameA = a.translations?.vie?.common
                || a.name.common;

            const nameB = b.translations?.vie?.common
                || b.name.common;

            return nameA.localeCompare(nameB, "vi");
        });

        if (currentCategory === "country") {
            renderCards();
        }

    } catch (error) {
        console.error(error);

        if (currentCategory === "country") {
            document.getElementById("count").textContent =
                "Không thể tải dữ liệu quốc gia.";

            document.getElementById("grid").innerHTML = `
                <div class="empty">
                    <h2>⚠️ Lỗi tải dữ liệu</h2>
                    <p>
                        Kiểm tra kết nối Internet rồi tải lại trang.
                    </p>
                </div>
            `;
        }
    }
}

// =====================================
// 9. KHỞI ĐỘNG
// =====================================

renderCards();
loadCountries();

</script>
