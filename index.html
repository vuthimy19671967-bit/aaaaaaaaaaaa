```html
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Dino & World Explorer</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: #0d1117;
      color: #f0f6fc;
    }

    header {
      padding: 25px;
      text-align: center;
      background: linear-gradient(135deg, #172554, #064e3b);
      border-bottom: 1px solid #30363d;
    }

    header h1 {
      margin: 0;
      font-size: 32px;
    }

    header p {
      color: #c9d1d9;
      margin-bottom: 0;
    }

    nav {
      display: flex;
      justify-content: center;
      gap: 10px;
      flex-wrap: wrap;
      padding: 15px;
      background: #161b22;
      position: sticky;
      top: 0;
      z-index: 10;
    }

    nav button {
      background: #21262d;
      color: white;
      border: 1px solid #30363d;
      border-radius: 8px;
      padding: 10px 16px;
      cursor: pointer;
    }

    nav button:hover {
      background: #30363d;
    }

    main {
      width: min(1200px, 94%);
      margin: 30px auto;
    }

    section {
      margin-bottom: 45px;
    }

    section h2 {
      border-bottom: 1px solid #30363d;
      padding-bottom: 10px;
    }

    .search-box {
      display: flex;
      gap: 10px;
      margin: 20px 0;
    }

    .search-box input {
      flex: 1;
    }

    input {
      width: 100%;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid #30363d;
      background: #0d1117;
      color: white;
      outline: none;
    }

    input:focus {
      border-color: #58a6ff;
    }

    button {
      border: none;
      border-radius: 8px;
      padding: 11px 16px;
      cursor: pointer;
      background: #238636;
      color: white;
      font-weight: bold;
    }

    button:hover {
      filter: brightness(1.15);
    }

    .dino-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
      gap: 15px;
    }

    .dino-card {
      padding: 18px;
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 12px;
      transition: 0.2s;
    }

    .dino-card:hover {
      transform: translateY(-3px);
      border-color: #58a6ff;
    }

    .dino-card h3 {
      margin-top: 0;
      color: #7ee787;
    }

    .auth-container {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 20px;
    }

    .auth-box {
      padding: 20px;
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 12px;
    }

    .auth-box h3 {
      margin-top: 0;
    }

    .auth-box input {
      margin: 8px 0;
    }

    .auth-box button {
      margin-top: 8px;
    }

    #loginStatus {
      margin-top: 15px;
      padding: 10px;
      background: #0d1117;
      border-radius: 8px;
      color: #79c0ff;
    }

    .leaderboard {
      max-width: 700px;
      margin: auto;
    }

    .leaderboard-row {
      display: grid;
      grid-template-columns: 70px 1fr 120px;
      gap: 10px;
      align-items: center;
      padding: 13px;
      margin: 7px 0;
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 9px;
    }

    .rank {
      font-weight: bold;
      color: #f2cc60;
    }

    .login-count {
      text-align: right;
      color: #7ee787;
    }

    .country-list {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 10px;
    }

    .country {
      padding: 12px;
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 8px;
    }

    .loading {
      color: #8b949e;
    }

    .error {
      color: #ff7b72;
    }

    footer {
      text-align: center;
      padding: 30px;
      margin-top: 50px;
      background: #161b22;
      color: #8b949e;
    }

    @media (max-width: 600px) {
      header h1 {
        font-size: 25px;
      }

      .search-box {
        flex-direction: column;
      }

      .leaderboard-row {
        grid-template-columns: 50px 1fr 90px;
      }
    }
  </style>
</head>

<body>

<header>
  <h1>🦖 Dino & World Explorer 🌍</h1>
  <p>Explore dinosaurs, countries and the login leaderboard.</p>
</header>


<nav>
  <button onclick="scrollToSection('dinosaurs')">
    🦖 Dinosaurs
  </button>

  <button onclick="scrollToSection('countries')">
    🌍 Countries
  </button>

  <button onclick="scrollToSection('auth')">
    🔐 Account
  </button>

  <button onclick="scrollToSection('leaderboard')">
    🏆 Leaderboard
  </button>
</nav>


<main>

  <!-- ========================= -->
  <!-- DINOSAURS -->
  <!-- ========================= -->

  <section id="dinosaurs">

    <h2>🦖 Dinosaur Explorer</h2>

    <div class="search-box">
      <input
        id="dinoSearch"
        type="text"
        placeholder="Search dinosaur..."
        oninput="searchDinosaurs()"
      >
    </div>

    <div id="dinoGrid" class="dino-grid"></div>

  </section>


  <!-- ========================= -->
  <!-- COUNTRIES -->
  <!-- ========================= -->

  <section id="countries">

    <h2>🌍 World Explorer</h2>

    <div class="search-box">
      <input
        id="countrySearch"
        type="text"
        placeholder="Search country..."
        oninput="searchCountries()"
      >
    </div>

    <div id="countryList" class="country-list">
      <p class="loading">Loading countries...</p>
    </div>

  </section>


  <!-- ========================= -->
  <!-- AUTHENTICATION -->
  <!-- ========================= -->

  <section id="auth">

    <h2>🔐 Account</h2>

    <div class="auth-container">

      <!-- REGISTER -->

      <div class="auth-box">

        <h3>📝 Register</h3>

        <input
          id="registerUsername"
          type="text"
          placeholder="Username"
          maxlength="30"
        >

        <input
          id="registerEmail"
          type="email"
          placeholder="Email"
        >

        <input
          id="registerPassword"
          type="password"
          placeholder="Password"
        >

        <button onclick="register()">
          Register
        </button>

      </div>


      <!-- LOGIN -->

      <div class="auth-box">

        <h3>🔑 Login</h3>

        <input
          id="loginEmail"
          type="email"
          placeholder="Email"
        >

        <input
          id="loginPassword"
          type="password"
          placeholder="Password"
        >

        <button onclick="login()">
          Login
        </button>

        <button
          onclick="logout()"
          style="background:#da3633;"
        >
          Logout
        </button>

        <div id="loginStatus">
          Not logged in
        </div>

      </div>

    </div>

  </section>


  <!-- ========================= -->
  <!-- LEADERBOARD -->
  <!-- ========================= -->

  <section id="leaderboard">

    <h2>🏆 Login Leaderboard</h2>

    <div
      id="leaderboardList"
      class="leaderboard"
    >
      <p class="loading">
        Loading leaderboard...
      </p>
    </div>

  </section>

</main>


<footer>
  Dino & World Explorer 🦖🌍
</footer>


<script type="module">

  // =====================================================
  // FIREBASE IMPORTS
  // =====================================================

  import {
    initializeApp
  } from "https://www.gstatic.com/firebasejs/12.0.0/firebase-app.js";


  import {
    getAuth,
    createUserWithEmailAndPassword,
    signInWithEmailAndPassword,
    signOut,
    onAuthStateChanged
  } from "https://www.gstatic.com/firebasejs/12.0.0/firebase-auth.js";


  import {
    getFirestore,
    doc,
    setDoc,
    getDoc,
    updateDoc,
    increment,
    collection,
    query,
    orderBy,
    limit,
    getDocs
  } from "https://www.gstatic.com/firebasejs/12.0.0/firebase-firestore.js";


  // =====================================================
  // FIREBASE CONFIG
  // =====================================================

  const firebaseConfig = {

    apiKey:
      "AIzaSyAUrPG9K-4_zsUbkt8vytLRVJaP2Ve97gw",

    authDomain:
      "dino---world-explorer.firebaseapp.com",

    projectId:
      "dino---world-explorer",

    storageBucket:
      "dino---world-explorer.firebasestorage.app",

    messagingSenderId:
      "351083072960",

    appId:
      "1:351083072960:web:5ebb214d1e28aafc048c25",

    measurementId:
      "G-4RY1Q5MXBR"
  };


  // =====================================================
  // INITIALIZE FIREBASE
  // =====================================================

  const app = initializeApp(firebaseConfig);

  const auth = getAuth(app);

  const db = getFirestore(app);


  console.log("🔥 Firebase connected");


  // =====================================================
  // DINOSAUR DATA
  // =====================================================

 const dinosaurs = [
  "Tyrannosaurus Rex",
  "Giganotosaurus",
  "Spinosaurus",
  "Velociraptor",
  "Triceratops",
  "Stegosaurus",
  "Brachiosaurus",
  "Allosaurus",
  "Ankylosaurus",
  "Carnotaurus",
  "Parasaurolophus",
  "Dilophosaurus",
  "Apatosaurus",
  "Diplodocus",
  "Pachycephalosaurus",
  "Iguanodon",
  "Compsognathus",
  "Deinonychus",
  "Therizinosaurus",
  "Dreadnoughtus",
  "Albertosaurus",
  "Oviraptor",
  "Maiasaura",
  "Pachyrhinosaurus",
  "Ceratosaurus",
  "Coelophysis",
  "Styracosaurus",
  "Edmontosaurus",
  "Guanlong",
  "Yutyrannus",
  "Gallimimus",
  "Utahraptor",
  "Mosasaurus",
  "Pteranodon",

  // Dino Edition
  "Dodo",
  "Kenken"
];


  // =====================================================
  // DISPLAY DINOSAURS
  // =====================================================

  function displayDinosaurs(list) {

    const grid =
      document.getElementById("dinoGrid");

    grid.innerHTML = "";

    if (list.length === 0) {

      grid.innerHTML =
        "<p>No dinosaur found. Humanity survives another day.</p>";

      return;
    }


    list.forEach(name => {

      const card =
        document.createElement("div");

      card.className = "dino-card";

      card.innerHTML = `
        <h3>🦖 ${escapeHTML(name)}</h3>
        <p>Species explorer entry.</p>
      `;

      grid.appendChild(card);

    });

  }


  // =====================================================
  // DINOSAUR SEARCH
  // =====================================================

  window.searchDinosaurs = function () {

    const search =
      document
        .getElementById("dinoSearch")
        .value
        .toLowerCase()
        .trim();


    const filtered =
      dinosaurs.filter(dino =>
        dino.toLowerCase().includes(search)
      );


    displayDinosaurs(filtered);

  };


  displayDinosaurs(dinosaurs);


  // =====================================================
  // COUNTRY API
  // =====================================================

  let countries = [];


  async function loadCountries() {

    const list =
      document.getElementById("countryList");

    try {

      const response =
        await fetch(
          "https://restcountries.com/v3.1/all?fields=name,flags,cca2"
        );


      if (!response.ok) {
        throw new Error("Country API failed");
      }


      countries =
        await response.json();


      countries.sort((a, b) =>
        a.name.common.localeCompare(
          b.name.common
        )
      );


      displayCountries(countries);

    } catch (error) {

      console.error(error);

      list.innerHTML =
        '<p class="error">Could not load countries.</p>';

    }

  }


  // =====================================================
  // DISPLAY COUNTRIES
  // =====================================================

  function displayCountries(listData) {

    const list =
      document.getElementById("countryList");

    list.innerHTML = "";


    if (listData.length === 0) {

      list.innerHTML =
        "<p>No country found.</p>";

      return;
    }


    listData.forEach(country => {

      const div =
        document.createElement("div");

      div.className = "country";


      const flag =
        country.flags?.svg ||
        country.flags?.png ||
        "";


      div.innerHTML = `
        ${
          flag
            ? `<img
                src="${flag}"
                alt=""
                style="
                  width:35px;
                  height:22px;
                  object-fit:cover;
                  vertical-align:middle;
                  margin-right:8px;
                "
              >`
            : ""
        }

        <strong>
          ${escapeHTML(country.name.common)}
        </strong>

        <br>

        <small>
          ${escapeHTML(country.cca2 || "")}
        </small>
      `;


      list.appendChild(div);

    });

  }


  // =====================================================
  // COUNTRY SEARCH
  // =====================================================

  window.searchCountries = function () {

    const search =
      document
        .getElementById("countrySearch")
        .value
        .toLowerCase()
        .trim();


    const filtered =
      countries.filter(country =>
        country.name.common
          .toLowerCase()
          .includes(search)
      );


    displayCountries(filtered);

  };


  loadCountries();


  // =====================================================
  // REGISTER
  // =====================================================

  window.register = async function () {

    const username =
      document
        .getElementById("registerUsername")
        .value
        .trim();


    const email =
      document
        .getElementById("registerEmail")
        .value
        .trim();


    const password =
      document
        .getElementById("registerPassword")
        .value;


    if (!username || !email || !password) {

      alert(
        "Please fill in all fields."
      );

      return;
    }


    if (username.length < 2) {

      alert(
        "Username must contain at least 2 characters."
      );

      return;
    }


    try {

      const credential =
        await createUserWithEmailAndPassword(
          auth,
          email,
          password
        );


      const user =
        credential.user;


      await setDoc(
        doc(db, "users", user.uid),
        {
          username: username,
          loginCount: 0
        }
      );


      alert(
        "Registration successful!"
      );


      document
        .getElementById("registerUsername")
        .value = "";


      document
        .getElementById("registerEmail")
        .value = "";


      document
        .getElementById("registerPassword")
        .value = "";


      loadLeaderboard();


    } catch (error) {

      console.error(error);


      switch (error.code) {

        case "auth/email-already-in-use":

          alert(
            "This email is already registered."
          );

          break;


        case "auth/invalid-email":

          alert(
            "Invalid email address."
          );

          break;


        case "auth/weak-password":

          alert(
            "Password is too weak. Use at least 6 characters."
          );

          break;


        default:

          alert(
            "Registration failed: " +
            error.message
          );

      }

    }

  };


  // =====================================================
  // LOGIN
  // =====================================================

  window.login = async function () {

    const email =
      document
        .getElementById("loginEmail")
        .value
        .trim();


    const password =
      document
        .getElementById("loginPassword")
        .value;


    if (!email || !password) {

      alert(
        "Please enter your email and password."
      );

      return;
    }


    try {

      const credential =
        await signInWithEmailAndPassword(
          auth,
          email,
          password
        );


      const user =
        credential.user;


      const userRef =
        doc(db, "users", user.uid);


      const userDoc =
        await getDoc(userRef);


      if (userDoc.exists()) {

        await updateDoc(
          userRef,
          {
            loginCount: increment(1)
          }
        );

      } else {

        await setDoc(
          userRef,
          {
            username:
              user.email.split("@")[0],

            loginCount: 1
          }
        );

      }


      alert(
        "Login successful!"
      );


      loadLeaderboard();


    } catch (error) {

      console.error(error);


      switch (error.code) {

        case "auth/invalid-credential":

        case "auth/wrong-password":

          alert(
            "Incorrect email or password."
          );

          break;


        case "auth/invalid-email":

          alert(
            "Invalid email address."
          );

          break;


        case "auth/user-disabled":

          alert(
            "This account has been disabled."
          );

          break;


        default:

          alert(
            "Login failed: " +
            error.message
          );

      }

    }

  };


  // =====================================================
  // LOGOUT
  // =====================================================

  window.logout = async function () {

    try {

      await signOut(auth);

      alert(
        "Logged out."
      );

    } catch (error) {

      console.error(error);

      alert(
        "Logout failed."
      );

    }

  };


  // =====================================================
  // AUTH STATE
  // =====================================================

  onAuthStateChanged(
    auth,
    async user => {

      const status =
        document.getElementById(
          "loginStatus"
        );


      if (user) {

        const userDoc =
          await getDoc(
            doc(db, "users", user.uid)
          );


        if (userDoc.exists()) {

          const data =
            userDoc.data();


          status.textContent =
            "Logged in as: " +
            data.username;

        } else {

          status.textContent =
            "Logged in as: " +
            user.email;

        }

      } else {

        status.textContent =
          "Not logged in";

      }

    }
  );


  // =====================================================
  // LEADERBOARD
  // =====================================================

  window.loadLeaderboard = async function () {

    const container =
      document.getElementById(
        "leaderboardList"
      );


    container.innerHTML =
      '<p class="loading">Loading leaderboard...</p>';


    try {

      const usersRef =
        collection(
          db,
          "users"
        );


      const leaderboardQuery =
        query(
          usersRef,
          orderBy(
            "loginCount",
            "desc"
          ),
          limit(20)
        );


      const snapshot =
        await getDocs(
          leaderboardQuery
        );


      container.innerHTML = "";


      if (snapshot.empty) {

        container.innerHTML =
          "<p>No users yet.</p>";

        return;
      }


      let rank = 1;


      snapshot.forEach(
        docSnap => {

          const data =
            docSnap.data();


          const row =
            document.createElement("div");


          row.className =
            "leaderboard-row";


          const rankElement =
            document.createElement("span");

          rankElement.className =
            "rank";

          rankElement.textContent =
            "#" + rank;


          const nameElement =
            document.createElement("strong");

          nameElement.textContent =
            data.username || "Unknown";


          const countElement =
            document.createElement("span");

          countElement.className =
            "login-count";

          countElement.textContent =
            (data.loginCount || 0) +
            " logins";


          row.appendChild(
            rankElement
          );

          row.appendChild(
            nameElement
          );

          row.appendChild(
            countElement
          );


          container.appendChild(
            row
          );


          rank++;

        }
      );


    } catch (error) {

      console.error(error);


      container.innerHTML =
        `
        <p class="error">
          Could not load leaderboard.
          Check your Firestore Security Rules.
        </p>
        `;

    }

  };


  loadLeaderboard();


  // =====================================================
  // UTILITY
  // =====================================================

  function escapeHTML(value) {

    const div =
      document.createElement("div");

    div.textContent =
      String(value);

    return div.innerHTML;

  }


  window.scrollToSection =
    function(id) {

      const element =
        document.getElementById(id);

      if (element) {

        element.scrollIntoView({
          behavior: "smooth"
        });

      }

    };


</script>

</body>
</html>
```
